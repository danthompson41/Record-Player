[package]
name = "recordplayer-tauri"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Workspace crates
rp-core = { path = "../crates/rp-core" }
rp-audio-engine = { path = "../crates/rp-audio-engine" }
rp-waveform = { path = "../crates/rp-waveform" }
rp-library = { path = "../crates/rp-library" }
rp-app = { path = "../crates/rp-app" }
rp-analysis = { path = "../crates/rp-analysis" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
